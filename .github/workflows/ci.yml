name: CI Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: ["**"]

jobs:
  setup-lint:
    name: 1. Setup & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Spell Check
        run: npm run spell:check

  security-scan:
    name: 2a. Security Scan (Trivy)
    needs: setup-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  unit-tests:
    name: 2b. Unit Tests (Jest)
    needs: setup-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Run Jest
        run: npm run test -- --passWithNoTests

  type-check:
    name: 2c. Type Check (TSC)
    needs: setup-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: TSC Check
        run: npx tsc --noEmit -p tsconfig.json

  audit-build:
    name: 2d. Dependency Audit & Build
    needs: setup-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Audit
        run: npm audit --audit-level=critical --legacy-peer-deps || true
      - name: Build
        run: npm run build